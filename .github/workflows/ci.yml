# CI: regenerate the catalog page and validate it on every push and pull request.
# Least privilege: top-level read-only token; third-party actions pinned to full commit SHAs (version in the comment).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Regenerate page
        run: python arastirma/sayfa-uret.py
      - name: Page must match the committed one
        run: git diff --exit-code -- sayfalar
      - name: Validate
        run: python arastirma/sayfa-dogrula.py
